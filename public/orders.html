<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn Hàng Của Tôi - TechStore</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./img/logo/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./img/logo/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./img/logo/favicon-16x16.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom styles -->
    <link rel="stylesheet" href="/styles.css">

    <style>
        .timeline {
            position: relative;
            padding: 20px 0;
        }

        .timeline-item {
            display: flex;
            gap: 20px;
            position: relative;
            padding-bottom: 30px;
        }

        .timeline-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 25px;
            top: 50px;
            width: 2px;
            height: calc(100% + 30px);
            background: #e5e7eb;
        }

        .timeline-item.active::after {
            background: #22c55e;
        }

        .timeline-dot {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #f3f4f6;
            border: 2px solid #d1d5db;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 20px;
            position: relative;
            z-index: 1;
        }

        .timeline-item.active .timeline-dot {
            background: #22c55e;
            border-color: #16a34a;
            color: white;
        }

        .timeline-item.completed .timeline-dot {
            background: #22c55e;
            border-color: #16a34a;
            color: white;
        }

        .timeline-content {
            flex: 1;
            padding-top: 5px;
        }

        .timeline-content h4 {
            font-weight: 600;
            color: #1f2937;
            margin: 0 0 5px 0;
        }

        .timeline-content p {
            color: #6b7280;
            font-size: 14px;
            margin: 0;
        }

        .order-status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-paid {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-shipped {
            background: #d1fae5;
            color: #065f46;
        }

        .status-delivered {
            background: #dcfce7;
            color: #166534;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .order-card {
            transition: all 0.3s ease;
        }

        .order-card:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div id="site-header"></div>
    <script src="/include-partials.js?v=2.0" defer></script>
    <script src="/app.js?v=2.0" defer></script>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">
            <i class="fas fa-box mr-2 text-red-600"></i>Đơn Hàng Của Tôi
        </h1>

        <!-- Filter & Sort -->
        <div class="mb-6 flex flex-col sm:flex-row gap-3">
            <select id="statusFilter" class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-red-500">
                <option value="">Tất cả đơn hàng</option>
                <option value="pending">Chờ xử lý</option>
                <option value="paid">Đã thanh toán</option>
                <option value="shipped">Đang giao</option>
                <option value="delivered">Đã giao</option>
                <option value="cancelled">Đã hủy</option>
            </select>
            <button onclick="loadOrders()" class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition-colors">
                <i class="fas fa-sync mr-2"></i>Làm mới
            </button>
        </div>

        <!-- Orders List -->
        <div id="ordersContainer" class="space-y-4">
            <div class="text-center py-12">
                <i class="fas fa-spinner fa-spin text-4xl text-gray-400 mb-4"></i>
                <p class="text-gray-600">Đang tải đơn hàng...</p>
            </div>
        </div>
        <div id="ordersPagination" class="mt-6 flex justify-center gap-2"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12 bg-white rounded-lg">
            <i class="fas fa-inbox text-5xl text-gray-400 mb-4"></i>
            <p class="text-gray-600 text-lg">Chưa có đơn hàng nào</p>
            <a href="/" class="inline-block mt-4 bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Quay lại mua sắm
            </a>
        </div>
    </div>

    <!-- Tracking Modal -->
    <div id="trackingModal" class="modal">
        <div class="modal-content">
            <div class="p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold">
                        <i class="fas fa-truck mr-2 text-red-600"></i>Theo Dõi Đơn Hàng
                    </h2>
                    <button onclick="closeTrackingModal()" class="text-gray-500 hover:text-gray-700 text-2xl">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- Order ID & Status -->
                <div class="mb-6 pb-6 border-b">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-gray-600">Mã đơn hàng:</span>
                        <span id="trackingOrderId" class="font-bold text-lg">-</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-gray-600">Trạng thái:</span>
                        <span id="trackingStatus" class="order-status-badge status-pending">-</span>
                    </div>
                </div>

                <!-- Timeline Progress -->
                <div class="mb-6 pb-6 border-b">
                    <h3 class="font-bold text-gray-800 mb-4">Quá Trình Giao Hàng</h3>
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex flex-col items-center flex-1">
                            <div class="w-10 h-10 rounded-full bg-green-500 text-white flex items-center justify-center mb-2">
                                <i class="fas fa-check"></i>
                            </div>
                            <span class="text-xs text-center">Đơn Hàng Đã Đặt</span>
                        </div>
                        <div class="flex-1 h-1 bg-green-500 mx-1"></div>
                        <div class="flex flex-col items-center flex-1">
                            <div id="step2" class="w-10 h-10 rounded-full bg-gray-300 text-white flex items-center justify-center mb-2">
                                <i class="fas fa-credit-card"></i>
                            </div>
                            <span class="text-xs text-center">Thanh Toán</span>
                        </div>
                        <div id="line3" class="flex-1 h-1 bg-gray-300 mx-1"></div>
                        <div class="flex flex-col items-center flex-1">
                            <div id="step3" class="w-10 h-10 rounded-full bg-gray-300 text-white flex items-center justify-center mb-2">
                                <i class="fas fa-box"></i>
                            </div>
                            <span class="text-xs text-center">Giao ĐVVC</span>
                        </div>
                        <div id="line4" class="flex-1 h-1 bg-gray-300 mx-1"></div>
                        <div class="flex flex-col items-center flex-1">
                            <div id="step4" class="w-10 h-10 rounded-full bg-gray-300 text-white flex items-center justify-center mb-2">
                                <i class="fas fa-home"></i>
                            </div>
                            <span class="text-xs text-center">Nhận Hàng</span>
                        </div>
                    </div>
                </div>

                <!-- Shipping Address -->
                <div class="mb-6 pb-6 border-b">
                    <h3 class="font-bold text-gray-800 mb-2">Địa Chỉ Giao Hàng</h3>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="font-semibold text-gray-800" id="trackingCustomerName">-</p>
                        <p class="text-gray-600 text-sm" id="trackingPhone">-</p>
                        <p class="text-gray-600 text-sm" id="trackingAddress">-</p>
                    </div>
                </div>

                <!-- Timeline Details -->
                <div class="mb-6">
                    <h3 class="font-bold text-gray-800 mb-4">Chi Tiết Giao Hàng</h3>
                    <div id="trackingTimeline" class="timeline">
                        <!-- Timeline items will be injected here -->
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-3">
                    <button onclick="closeTrackingModal()" class="flex-1 bg-gray-200 text-gray-800 py-2 rounded-lg hover:bg-gray-300 transition-colors font-semibold">
                        <i class="fas fa-arrow-left mr-2"></i>Quay Lại
                    </button>
                    <button onclick="printTracking()" class="flex-1 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition-colors font-semibold">
                        <i class="fas fa-print mr-2"></i>In
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-white rounded-lg shadow-lg p-4 hidden z-50 max-w-sm"></div>

    <script>
        const API_BASE_URL = 'http://localhost:5000/api';
        let currentTracking = null;

        // Check auth
        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login.html?redirect=orders';
                return false;
            }
            return true;
        }

        // API call
        async function apiCall(endpoint, options = {}) {
            const token = localStorage.getItem('token');
            if (!token) throw new Error('Vui lòng đăng nhập');

            const response = await fetch(`${API_BASE_URL}${endpoint}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...(options.headers || {})
                }
            });

            const data = await response.json();
            if (!response.ok) {
                if (response.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/login.html?redirect=orders';
                    return;
                }
                throw new Error(data.message || 'Có lỗi xảy ra');
            }
            return data;
        }

        // Format giá
        function formatPrice(price) {
            return new Intl.NumberFormat('vi-VN').format(price) + ' ₫';
        }

        // Format ngày
        function formatDate(date) {
            return new Date(date).toLocaleDateString('vi-VN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Get status badge
        function getStatusBadge(status) {
            const badges = {
                pending: { class: 'status-pending', text: 'Chờ xử lý' },
                paid: { class: 'status-paid', text: 'Đã thanh toán' },
                shipped: { class: 'status-shipped', text: 'Đang giao' },
                delivered: { class: 'status-delivered', text: 'Đã giao' },
                cancelled: { class: 'status-cancelled', text: 'Đã hủy' }
            };
            return badges[status] || badges.pending;
        }

        // Pagination state
        let ordersPagination = { page: 1, limit: 8, totalPages: 1, totalItems: 0 };

        function renderOrdersPagination() {
            const el = document.getElementById('ordersPagination');
            if (!el) return;
            if (!ordersPagination.totalPages || ordersPagination.totalPages <= 1) {
                el.innerHTML = '';
                return;
            }

            const page = ordersPagination.page;
            const totalPages = ordersPagination.totalPages;
            let html = '';

            html += `<button ${page === 1 ? 'disabled' : ''} onclick="changeOrdersPage(${page - 1})"
                class="px-3 py-2 border rounded-lg ${page === 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-50'}">‹</button>`;

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= page - 2 && i <= page + 2)) {
                    html += `<button onclick="changeOrdersPage(${i})"
                        class="px-3 py-2 border rounded-lg ${i === page ? 'bg-red-600 text-white border-red-600' : 'hover:bg-gray-50'}">${i}</button>`;
                } else if (i === page - 3 || i === page + 3) {
                    html += `<button disabled class="px-3 py-2 opacity-50">...</button>`;
                }
            }

            html += `<button ${page === totalPages ? 'disabled' : ''} onclick="changeOrdersPage(${page + 1})"
                class="px-3 py-2 border rounded-lg ${page === totalPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-50'}">›</button>`;

            el.innerHTML = html;
        }

        function changeOrdersPage(p) {
            ordersPagination.page = Math.max(1, p);
            loadOrders();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Load orders
        async function loadOrders() {
            if (!checkAuth()) return;

            try {
                const statusFilter = document.getElementById('statusFilter').value;
                const params = new URLSearchParams();
                params.set('page', String(ordersPagination.page || 1));
                params.set('limit', String(ordersPagination.limit || 8));
                const response = await apiCall(`/orders?${params.toString()}`);

                let orders = response.orders || response || [];
                if (response.pagination) {
                    ordersPagination.totalPages = Number(response.pagination.totalPages || 1);
                    ordersPagination.totalItems = Number(response.pagination.totalItems || 0);
                } else {
                    ordersPagination.totalPages = 1;
                    ordersPagination.totalItems = orders.length;
                }
                
                if (statusFilter) {
                    orders = orders.filter(o => o.status === statusFilter);
                }

                renderOrders(orders);
                renderOrdersPagination();
            } catch (error) {
                console.error('Error loading orders:', error);
                showToast(error.message, 'error');
            }
        }

        // Render orders
        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');
            
            if (!orders || orders.length === 0) {
                container.innerHTML = '';
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }

            document.getElementById('emptyState').classList.add('hidden');

            container.innerHTML = orders.map(order => {
                const statusBadge = getStatusBadge(order.status);
                const total = parseFloat(order.total || 0);
                const itemCount = order.items ? order.items.length : 0;

                return `
                    <div class="order-card bg-white rounded-lg shadow p-6">
                        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-4">
                            <div>
                                <h3 class="text-lg font-bold text-gray-800">Đơn hàng #${order.id}</h3>
                                <p class="text-sm text-gray-600">${formatDate(order.created_at)}</p>
                            </div>
                            <span class="order-status-badge ${statusBadge.class}">${statusBadge.text}</span>
                        </div>

                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4 py-4 border-y">
                            <div>
                                <p class="text-xs text-gray-600 mb-1">Số lượng</p>
                                <p class="font-bold">${itemCount} sản phẩm</p>
                            </div>
                            <div>
                                <p class="text-xs text-gray-600 mb-1">Tổng tiền</p>
                                <p class="font-bold text-red-600">${formatPrice(total)}</p>
                            </div>
                            <div>
                                <p class="text-xs text-gray-600 mb-1">Phương thức</p>
                                <p class="font-bold">${order.payment_method || 'N/A'}</p>
                            </div>
                            <div>
                                <p class="text-xs text-gray-600 mb-1">Địa chỉ</p>
                                <p class="font-bold text-sm">${(order.shipping_address || 'N/A').substring(0, 30)}...</p>
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row gap-3">
                            <button 
                                onclick="showTracking(${order.id})"
                                class="flex-1 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition-colors font-semibold"
                            >
                                <i class="fas fa-truck mr-2"></i>Theo Dõi
                            </button>
                            <button 
                                onclick="viewOrderDetails(${order.id})"
                                class="flex-1 bg-gray-200 text-gray-800 py-2 rounded-lg hover:bg-gray-300 transition-colors font-semibold"
                            >
                                <i class="fas fa-eye mr-2"></i>Chi Tiết
                            </button>
                            ${order.status === 'pending' ? `
                                <button 
                                    onclick="cancelOrder(${order.id})"
                                    class="flex-1 bg-orange-500 text-white py-2 rounded-lg hover:bg-orange-600 transition-colors font-semibold"
                                >
                                    <i class="fas fa-times mr-2"></i>Hủy Đơn
                                </button>
                                <button 
                                    onclick="editOrder(${order.id})"
                                    class="flex-1 bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition-colors font-semibold"
                                >
                                    <i class="fas fa-edit mr-2"></i>Sửa Đơn
                                </button>
                            ` : ''}
                            ${order.status === 'delivered' || order.status === 'cancelled' ? `
                                <button 
                                    onclick="reorder(${order.id})"
                                    class="flex-1 bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition-colors font-semibold"
                                >
                                    <i class="fas fa-redo mr-2"></i>Đặt Lại
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Show tracking
        async function showTracking(orderId) {
            try {
                const response = await apiCall(`/orders/${orderId}`);
                const order = response.order || response;

                currentTracking = order;

                // Fill info
                document.getElementById('trackingOrderId').textContent = `#${order.id}`;
                const statusBadge = getStatusBadge(order.status);
                document.getElementById('trackingStatus').className = `order-status-badge ${statusBadge.class}`;
                document.getElementById('trackingStatus').textContent = statusBadge.text;

                document.getElementById('trackingCustomerName').textContent = order.customer_name || 'N/A';
                document.getElementById('trackingPhone').textContent = order.shipping_phone || 'N/A';
                document.getElementById('trackingAddress').textContent = order.shipping_address || 'N/A';

                // Update progress steps
                updateProgressSteps(order.status);

                // Load shipment events từ API hoặc dùng default timeline
                loadShipmentEvents(order.id);

                document.getElementById('trackingModal').classList.add('active');
            } catch (error) {
                console.error('Error loading tracking:', error);
                showToast(error.message, 'error');
            }
        }

        // Update progress steps
        function updateProgressSteps(status) {
            const steps = {
                pending: 1,
                paid: 2,
                shipped: 3,
                delivered: 4
            };
            const currentStep = steps[status] || 1;

            for (let i = 2; i <= 4; i++) {
                const step = document.getElementById(`step${i}`);
                const line = document.getElementById(`line${i}`);
                if (step) {
                    if (i <= currentStep) {
                        step.className = 'w-10 h-10 rounded-full bg-green-500 text-white flex items-center justify-center mb-2';
                    } else {
                        step.className = 'w-10 h-10 rounded-full bg-gray-300 text-white flex items-center justify-center mb-2';
                    }
                }
                if (line && i < 4) {
                    line.className = `flex-1 h-1 ${i < currentStep ? 'bg-green-500' : 'bg-gray-300'} mx-1`;
                }
            }
        }

        // Render timeline
        function renderTimeline(order) {
            const timeline = [
                { icon: '📋', title: 'Đơn Hàng Đã Đặt', time: order.created_at, status: true },
                { icon: '💳', title: 'Đơn Hàng Đã Thanh Toán', time: order.updated_at, status: order.status !== 'pending' },
                { icon: '📦', title: 'Đã Giao Cho ĐVVC', time: order.shipped_at || null, status: ['shipped', 'delivered'].includes(order.status) },
                { icon: '🏠', title: 'Đã Nhận Được Hàng', time: order.delivered_at || null, status: order.status === 'delivered' }
            ];

            const timelineHtml = timeline.map((item, idx) => `
                <div class="timeline-item ${item.status ? 'completed' : ''}">
                    <div class="timeline-dot">${item.icon}</div>
                    <div class="timeline-content">
                        <h4>${item.title}</h4>
                        ${item.time ? `<p>${formatDate(item.time)}</p>` : '<p class="text-gray-400">Đang chờ xử lý...</p>'}
                    </div>
                </div>
            `).join('');

            document.getElementById('trackingTimeline').innerHTML = timelineHtml;
        }

        // Load shipment events từ API
        async function loadShipmentEvents(orderId) {
            try {
                const response = await apiCall(`/shipments/${orderId}`);
                
                if (!response.shipment) {
                    // Chưa có shipment, dùng default timeline
                    renderTimeline(currentTracking);
                    return;
                }

                const shipment = response.shipment;
                const events = response.events || [];

                // Map shipment events to timeline
                const timelineItems = events.map(event => {
                    const statusIcons = {
                        'pending': '📋',
                        'picked_up': '📦',
                        'in_transit': '🚚',
                        'out_for_delivery': '🚗',
                        'delivered': '✅',
                        'returned': '↩️',
                        'failed': '❌'
                    };

                    return {
                        icon: statusIcons[event.status] || '📍',
                        title: event.event_label || getStatusLabel(event.status),
                        time: event.event_time,
                        location: event.location,
                        status: true
                    };
                });

                // Render dynamic timeline
                const timelineHtml = timelineItems.map((item, idx) => `
                    <div class="timeline-item completed">
                        <div class="timeline-dot">${item.icon}</div>
                        <div class="timeline-content">
                            <h4>${item.title}</h4>
                            <p>${formatDate(item.time)}</p>
                            ${item.location ? `<p class="text-gray-400 text-xs"><i class="fas fa-map-marker-alt mr-1"></i>${item.location}</p>` : ''}
                        </div>
                    </div>
                `).join('');

                document.getElementById('trackingTimeline').innerHTML = timelineHtml || 'Chưa có cập nhật tracking';

            } catch (error) {
                console.error('Error loading shipment events:', error);
                // Fallback to default timeline
                renderTimeline(currentTracking);
            }
        }

        // Helper: Get status label
        function getStatusLabel(status) {
            const labels = {
                'pending': 'Đơn hàng đang được chuẩn bị',
                'picked_up': 'Đơn hàng đã được nhặt từ kho',
                'in_transit': 'Đơn hàng đang được vận chuyển',
                'out_for_delivery': 'Đơn hàng đang được giao tới bạn',
                'delivered': 'Đơn hàng đã được giao thành công',
                'returned': 'Đơn hàng đã được hoàn trả',
                'failed': 'Giao hàng không thành công'
            };
            return labels[status] || 'Cập nhật trạng thái';
        }

        // Close modal
        function closeTrackingModal() {
            document.getElementById('trackingModal').classList.remove('active');
        }

        // Print tracking
        function printTracking() {
            if (!currentTracking) return;
            window.print();
        }

        // View order details
        function viewOrderDetails(orderId) {
            showTracking(orderId);
        }

        // Cancel order
        async function cancelOrder(orderId) {
            if (!confirm('Bạn có chắc chắn muốn hủy đơn hàng này?')) {
                return;
            }

            const reason = prompt('Vui lòng nhập lý do hủy đơn hàng (tùy chọn):') || 'Người dùng hủy đơn hàng';

            try {
                const response = await apiCall(`/orders/${orderId}/cancel`, {
                    method: 'PUT',
                    body: JSON.stringify({ reason })
                });

                showToast('Đã hủy đơn hàng thành công', 'success');
                
                // Add notification if function exists
                if (typeof addNotification !== 'undefined' && typeof NOTIFICATION_TYPES !== 'undefined') {
                    addNotification(
                        NOTIFICATION_TYPES.ORDER_CANCELLED,
                        `Đơn hàng #${orderId} đã bị hủy`,
                        { orderId }
                    );
                }
                
                setTimeout(() => {
                    loadOrders();
                }, 1000);
            } catch (error) {
                console.error('Error cancelling order:', error);
                showToast(error.message || 'Lỗi khi hủy đơn hàng', 'error');
            }
        }

        // Edit order
        async function editOrder(orderId) {
            try {
                // Lấy thông tin đơn hàng
                const response = await apiCall(`/orders/${orderId}`);
                const order = response.order || response;

                // Hiển thị form chỉnh sửa
                const newAddress = prompt('Nhập địa chỉ giao hàng mới:', order.shipping_address || '');
                if (newAddress === null) return; // User cancelled

                const newPhone = prompt('Nhập số điện thoại mới:', order.shipping_phone || '');
                if (newPhone === null) return; // User cancelled

                if (!newAddress.trim()) {
                    showToast('Địa chỉ giao hàng không được để trống', 'error');
                    return;
                }

                // Cập nhật đơn hàng
                const updateResponse = await apiCall(`/orders/${orderId}`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        shipping_address: newAddress.trim(),
                        phone: newPhone.trim()
                    })
                });

                showToast('Đã cập nhật đơn hàng thành công', 'success');
                setTimeout(() => {
                    loadOrders();
                }, 1000);
            } catch (error) {
                console.error('Error editing order:', error);
                showToast(error.message || 'Lỗi khi cập nhật đơn hàng', 'error');
            }
        }

        // Reorder
        async function reorder(orderId) {
            if (!confirm('Bạn có muốn đặt lại đơn hàng này? Các sản phẩm sẽ được thêm vào giỏ hàng.')) {
                return;
            }

            try {
                const response = await apiCall(`/orders/${orderId}/reorder`, {
                    method: 'POST'
                });

                showToast(`Đã thêm ${response.items_added || 0} sản phẩm vào giỏ hàng`, 'success');
                
                // Chuyển đến giỏ hàng sau 1.5 giây
                setTimeout(() => {
                    window.location.href = '/cart.html';
                }, 1500);
            } catch (error) {
                console.error('Error reordering:', error);
                showToast(error.message || 'Lỗi khi đặt lại đơn hàng', 'error');
            }
        }

        // Show toast
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const bgColor = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            toast.className = `fixed bottom-4 right-4 ${bgColor} text-white rounded-lg shadow-lg p-4 z-50 max-w-sm`;
            toast.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // Close modal on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeTrackingModal();
            }
        });

        // Close modal on background click
        document.getElementById('trackingModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('trackingModal')) {
                closeTrackingModal();
            }
        });

        // Init
        document.addEventListener('DOMContentLoaded', async () => {
            if (checkAuth()) {
                // Wait for orders to load first
                await loadOrders();

                // If a focus query param is present (e.g. ?focus=123), open tracking for that order
                const params = new URLSearchParams(window.location.search);
                const focus = params.get('focus');
                if (focus) {
                    // Try to parse to integer
                    const orderId = parseInt(focus, 10);
                    if (!isNaN(orderId)) {
                        // open tracking modal
                        showTracking(orderId);
                        // remove focus param from URL to avoid re-opening on reload
                        params.delete('focus');
                        const newSearch = params.toString();
                        const newUrl = window.location.pathname + (newSearch ? ('?' + newSearch) : '');
                        window.history.replaceState({}, document.title, newUrl);
                    }
                }
            }
        });

        // Filter change
        document.getElementById('statusFilter').addEventListener('change', loadOrders);
    </script>
</body>
</html>
